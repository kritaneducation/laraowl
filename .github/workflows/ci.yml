name: CI and deployment

# ---------------------------------------------------------------------------
# Everything compiles on the runner. The build job produces a deploy bundle
# that already contains vendor/, public/build/ and the generated Wayfinder
# client, so the server never runs composer downloads, npm, or a Vite build.
#
# This is the same sequence `php artisan laraowl:update` performs, with the
# three compile steps (composer install, npm ci, npm run build) lifted onto CI:
#
#   pull -> composer install -> npm ci -> npm run build -> migrate
#        -> rollups:backfill -> optimize:clear -> queue:restart
#
# Required repository secrets:
#   P_HOST, P_USERNAME, P_SSH_KEY, P_SSH_PASSPHRASE  production SSH access
#   DEPLOY_PATH                                      app root on the server
#   DEPLOY_HEALTHCHECK_URL                           optional, e.g. https://host/up
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # composer.json requires ^8.3 and the README states PHP 8.3+, so vendor/ is
  # built on the floor of the supported range and stays usable on newer minors.
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  APP_ENV: testing
  APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
  COMPOSER_NO_INTERACTION: 1

jobs:
  quality:
    name: PHP quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, curl, libxml, sqlite, bcmath, intl, gd, zip, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: Validate dependency manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --optimize-autoloader

      - name: Audit PHP dependencies
        run: composer audit --locked

      # -v prints the offending diff, so a failure here is actionable from the
      # log alone rather than just naming the file.
      - name: Check PHP formatting
        run: vendor/bin/pint --test --parallel -v

  frontend:
    name: Frontend lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, curl, libxml, sqlite, bcmath, intl, gd, zip, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prepare application environment
        run: |
          cp .env.example .env
          mkdir -p database storage/framework/{cache,sessions,testing,views} storage/logs bootstrap/cache
          touch database/database.sqlite
          chmod -R u+rwX,g+rwX storage bootstrap/cache database

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci --no-fund

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      # Also generates resources/js/{actions,routes,wayfinder}. Those are
      # gitignored, and both eslint's resolver and tsc need them present.
      - name: Build production assets
        run: npm run build

      - name: Verify Vite manifest
        run: test -f public/build/manifest.json

      - name: Check JavaScript linting
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Check TypeScript types
        run: npm run types:check

  tests:
    name: Pest suite (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # .env.example points cache, session and queue at the database. The cache
    # verification below runs outside Pest, so without these it would try to
    # truncate a `cache` table that was never migrated.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, curl, libxml, sqlite, bcmath, intl, gd, zip, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p database storage/framework/{cache,sessions,testing,views} storage/logs bootstrap/cache
          touch database/database.sqlite
          chmod -R u+rwX,g+rwX storage bootstrap/cache database

      # Feature tests render the Inertia root view, so the Vite manifest has to
      # exist before Pest runs.
      - name: Install dependencies and assets
        run: |
          composer install --prefer-dist --no-progress --optimize-autoloader
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Pest suites
        run: php artisan test --compact

      - name: Verify config, route, view, and event caches
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
          php artisan optimize:clear

  database:
    name: Pest suite (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            extension: pdo_mysql
            port: '3306'
            username: root
          - driver: pgsql
            extension: pdo_pgsql
            port: '5432'
            username: laraowl

    # The full suite runs against both engines the README supports for
    # production, on top of a migrate/seed/replay of the schema. RollupWriter,
    # RecordService and IssueService all branch on the driver, so SQLite alone
    # leaves the production SQL paths unexecuted.
    env:
      DB_CONNECTION: ${{ matrix.driver }}
      DB_DATABASE: laraowl_test
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: laraowl
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: laraowl_test
          MYSQL_ROOT_PASSWORD: laraowl
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=laraowl"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: laraowl_test
          POSTGRES_USER: laraowl
          POSTGRES_PASSWORD: laraowl
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U laraowl -d laraowl_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, curl, libxml, ${{ matrix.extension }}, bcmath, intl, gd, zip, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p storage/framework/{cache,sessions,testing,views} storage/logs bootstrap/cache
          chmod -R u+rwX,g+rwX storage bootstrap/cache

      # phpunit.xml hard-codes the SQLite driver and PHPUnit applies its <env>
      # entries before Laravel boots, so the file itself has to be repointed.
      - name: Point PHPUnit at ${{ matrix.driver }}
        run: |
          sed -i \
            -e 's|<env name="DB_CONNECTION" value="sqlite"/>|<env name="DB_CONNECTION" value="${{ matrix.driver }}"/>|' \
            -e 's|<env name="DB_DATABASE" value=":memory:"/>|<env name="DB_DATABASE" value="laraowl_test"/>|' \
            phpunit.xml
          grep -q 'value="${{ matrix.driver }}"' phpunit.xml
          grep -q 'value="laraowl_test"' phpunit.xml

      # Feature tests render the Inertia root view, so the Vite manifest has to
      # exist before Pest runs.
      - name: Install dependencies and assets
        run: |
          composer install --prefer-dist --no-progress --optimize-autoloader
          npm ci --no-audit --no-fund
          npm run build

      - name: Rebuild and seed the schema
        run: php artisan migrate:fresh --seed --force --no-interaction

      - name: Verify migration replay is clean
        run: php artisan migrate --force --no-interaction

      - name: Run Pest suites
        run: php artisan test --compact

  build:
    name: Production artifact
    runs-on: ubuntu-latest
    needs: [quality, frontend, tests, database]
    # Also on workflow_dispatch, so a release can be re-cut from the UI or the
    # CLI without pushing an empty commit.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20
    env:
      APP_ENV: production
      APP_DEBUG: false

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, curl, libxml, bcmath, intl, gd, zip, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Wayfinder shells out to artisan during the Vite build, so the app has to
      # be bootable here. This .env is excluded from the artifact below.
      - name: Build deployable application
        run: |
          cp .env.example .env
          mkdir -p storage/framework/{cache,sessions,testing,views} storage/logs bootstrap/cache
          composer install --no-dev --prefer-dist --no-progress --classmap-authoritative
          npm ci --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json
          test -d vendor/laravel/framework
          rm -rf node_modules

      - name: Upload production artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deploy-bundle-${{ github.sha }}
          retention-days: 3
          compression-level: 9
          include-hidden-files: true
          path: |
            .
            !.git/
            !.github/
            !.agents/
            !.claude/
            !.gemini/
            !art/
            !docker/
            !node_modules/
            !tests/
            !storage/logs/
            !storage/framework/cache/
            !storage/framework/sessions/
            !storage/framework/views/
            !database/*.sqlite
            !.env*
            !docker-compose.yaml
            !.dockerignore
            !phpunit.xml
            !eslint.config.js

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    timeout-minutes: 20

    steps:
      - name: Confirm a deployment target is configured
        id: target
        env:
          P_HOST: ${{ secrets.P_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$P_HOST" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::Set the P_HOST and DEPLOY_PATH secrets to enable the release. The artifact was still built and is attached to this run."
          fi

      - name: Download production artifact
        if: steps.target.outputs.configured == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: deploy-bundle-${{ github.sha }}

      - name: Drain production queues
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.P_HOST }}
          username: ${{ secrets.P_USERNAME }}
          key: ${{ secrets.P_SSH_KEY }}
          passphrase: ${{ secrets.P_SSH_PASSPHRASE }}
          command_timeout: 7m
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            php artisan queue:restart || true
            php artisan queue:work --stop-when-empty --max-time=300 --tries=3 --timeout=120 || true

      - name: Transfer artifact
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.P_HOST }}
          username: ${{ secrets.P_USERNAME }}
          key: ${{ secrets.P_SSH_KEY }}
          passphrase: ${{ secrets.P_SSH_PASSPHRASE }}
          source: .
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Finalize deployment
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        with:
          host: ${{ secrets.P_HOST }}
          username: ${{ secrets.P_USERNAME }}
          key: ${{ secrets.P_SSH_KEY }}
          passphrase: ${{ secrets.P_SSH_PASSPHRASE }}
          command_timeout: 15m
          envs: DEPLOY_HEALTHCHECK_URL
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x deploy.sh
            ./deploy.sh --ci --skip-git
